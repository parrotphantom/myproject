<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苍穹外卖 - 登录</title>
    <!-- 引入外部 CSS 样式文件 -->
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-title">🌤 苍穹外卖</div>
            <div class="login-subtitle">欢迎回来，请登录您的账户</div>

            <form action="/api/login" method="post">
                <div class="form-group">
                    <label>👤 用户名</label>
                    <input name="username" type="text" placeholder="请输入用户名/邮箱" required>
                </div>
                <div class="form-group">
                    <label>🔒 密码</label>
                    <input name="password" type="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <div class="login-footer">
                还没有账号？ <a href="/api/signup">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
